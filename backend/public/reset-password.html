<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Wave</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.45) saturate(1.1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.65) 100%);
            z-index: -1;
        }

        .glass-container {
            width: 500px;
            position: relative;
        }

        .card {
            border-radius: 32px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .right-panel {
            padding: 50px 45px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            color: white;
        }

        .right-panel h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .right-panel .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 48px 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: #1DB954;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group i {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(90deg, #1DB954, #0f8b3e);
            color: black;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(29, 185, 84, 0.2);
            color: #1DB954;
            display: block;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            display: block;
        }

        .back-link {
            margin-top: 28px;
            text-align: center;
        }

        .back-link a {
            color: #1DB954;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 550px) {
            .glass-container {
                width: 95%;
            }
            .right-panel {
                padding: 40px 30px;
            }
            .right-panel h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="background-video">
        <source src="https://videos.pexels.com/video-files/3129670/3129670-uhd_2560_1440_30fps.mp4" type="video/mp4">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-waves-of-light-3710-large.mp4" type="video/mp4">
        <source src="https://cdn.pixabay.com/video/2023/06/22/169509-836060606_large.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="glass-container">
        <div class="card">
            <div class="right-panel">
                <h2>🔐 Reset Password</h2>
                <div class="sub">Enter your new password</div>

                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New password (min 6 characters)" />
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" />
                    <i class="fa-solid fa-check-circle"></i>
                </div>

                <button class="action-btn" id="resetBtn">Reset Password</button>

                <div id="message" class="message"></div>

                <div class="back-link">
                    <a href="login.html">← Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const messageDiv = document.getElementById('message');

        // Check if token exists
        if (!token) {
            messageDiv.textContent = '❌ Invalid or missing reset link. Please request a new one.';
            messageDiv.className = 'message error';
            resetBtn.disabled = true;
            resetBtn.style.opacity = '0.5';
            resetBtn.style.cursor = 'not-allowed';
        }

        async function resetPassword() {
            const password = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();

            // Clear previous message
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';

            // Validation
            if (!password || !confirm) {
                messageDiv.textContent = '❌ Please fill in both fields';
                messageDiv.className = 'message error';
                return;
            }

            if (password.length < 6) {
                messageDiv.textContent = '❌ Password must be at least 6 characters';
                messageDiv.className = 'message error';
                return;
            }

            if (password !== confirm) {
                messageDiv.textContent = '❌ Passwords do not match';
                messageDiv.className = 'message error';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = '✅ Password reset successfully! Redirecting to login...';
                    messageDiv.className = 'message success';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageDiv.textContent = '❌ ' + (data.error || 'Failed to reset password. Link may have expired.');
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                console.error('Reset error:', error);
                messageDiv.textContent = '❌ Server error. Please try again.';
                messageDiv.className = 'message error';
            }
        }

        resetBtn.addEventListener('click', resetPassword);

        // Enter key support
        confirmPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                resetPassword();
            }
        });

        newPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                confirmPassword.focus();
            }
        });
    </script>
</body>
</html>
