<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave • Reset Password</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.45) saturate(1.1);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.65) 100%);
      z-index: -1;
    }

    .glass-container {
      width: 900px;
      height: 520px;
      position: relative;
      perspective: 1500px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
    }

    .left-panel {
      flex: 1;
      padding: 50px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.15), rgba(0, 0, 0, 0.3));
      backdrop-filter: blur(4px);
    }

    .left-panel h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #1DB954);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .left-panel p {
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .wave-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(29, 185, 84, 0.2);
      padding: 8px 16px;
      border-radius: 40px;
      width: fit-content;
      margin-bottom: 24px;
      border: 1px solid rgba(29, 185, 84, 0.4);
    }

    .wave-badge i {
      color: #1DB954;
      font-size: 18px;
    }

    .wave-badge span {
      font-size: 13px;
      font-weight: 600;
    }

    .back-link {
      margin-top: 30px;
    }

    .back-link a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .back-link a:hover {
      color: #1DB954;
    }

    .right-panel {
      width: 420px;
      padding: 50px 45px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.3px;
    }

    .right-panel .sub {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 48px 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .input-group input:focus {
      border-color: #1DB954;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.2);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .input-group i {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: 0.2s;
    }

    .input-group i:hover {
      color: #1DB954;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(90deg, #1DB954, #0f8b3e);
      color: black;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .action-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
      background: linear-gradient(90deg, #1ed760, #1DB954);
    }

    .info-message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      text-align: center;
      background: rgba(29, 185, 84, 0.1);
      border: 1px solid rgba(29, 185, 84, 0.3);
      color: #1DB954;
      display: none;
    }

    .info-message.error {
      background: rgba(231, 76, 60, 0.1);
      border-color: rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1DB954;
      color: black;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      z-index: 1100;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      animation: fadeInUp 0.3s ease;
      pointer-events: none;
    }

    .toast-message.error {
      background: #e74c3c;
      color: white;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .success-animation {
      text-align: center;
      animation: fadeScale 0.5s ease;
    }

    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-icon {
      font-size: 64px;
      color: #1DB954;
      margin-bottom: 20px;
    }

    @media (max-width: 850px) {
      .glass-container {
        width: 95%;
        height: auto;
        min-height: 550px;
      }
      
      .card {
        flex-direction: column;
      }
      
      .right-panel {
        width: 100%;
        padding: 40px;
      }
      
      .left-panel {
        padding: 40px;
        text-align: center;
      }
      
      .wave-badge {
        margin: 0 auto 24px auto;
      }
      
      .left-panel h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline class="background-video" id="background-video">
    <source src="https://videos.pexels.com/video-files/3129670/3129670-uhd_2560_1440_30fps.mp4" type="video/mp4">
    <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-waves-of-light-3710-large.mp4" type="video/mp4">
    <source src="https://cdn.pixabay.com/video/2023/06/22/169509-836060606_large.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="glass-container">
    <div class="card">
      
      <div class="left-panel">
        <div class="wave-badge">
          <i class="fas fa-water"></i>
          <span>WAVE MUSIC</span>
        </div>
        <h1>Forgot Password?</h1>
        <p>
          Don't worry, it happens to the best of us. Enter your email address and we'll send you a reset link to create a new password.
        </p>
        <div class="back-link">
          <a href="login.html" id="backToLogin">
            <i class="fas fa-arrow-left"></i> Back to Sign In
          </a>
        </div>
      </div>

      <div class="right-panel" id="resetPanel">
        <div id="resetFormContent">
          <h2>Reset Password</h2>
          <div class="sub">Enter your email to receive reset link</div>

          <div class="input-group">
            <input type="email" id="resetEmail" placeholder="Email Address" autocomplete="off" />
            <i class="fa-solid fa-envelope"></i>
          </div>

          <button class="action-btn" id="sendResetBtn">Send Reset Link</button>
          
          <div id="infoMessage" class="info-message"></div>
        </div>
        
        <div id="successContent" style="display: none;">
          <div class="success-animation">
            <div class="success-icon">
              <i class="fas fa-check-circle"></i>
            </div>
            <h2 style="margin-bottom: 12px;">Check Your Email</h2>
            <p style="color: rgba(255,255,255,0.7); margin-bottom: 24px; font-size: 0.9rem;">
              We've sent a password reset link to <strong id="sentEmailDisplay"></strong>
            </p>
            <button class="action-btn" id="backToLoginFromSuccess">Return to Sign In</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // ============ API CONFIGURATION ============
    const API_URL = 'http://localhost:5000/api';

    // ============ VIDEO ============
    const video = document.getElementById('background-video');
    if (video) {
      video.play().catch(e => console.log('Video autoplay prevented:', e));
      video.playbackRate = 0.8;
      video.loop = true;
    }

    // ============ DOM ELEMENTS ============
    const resetEmail = document.getElementById('resetEmail');
    const sendResetBtn = document.getElementById('sendResetBtn');
    const infoMessage = document.getElementById('infoMessage');
    const resetFormContent = document.getElementById('resetFormContent');
    const successContent = document.getElementById('successContent');
    const sentEmailDisplay = document.getElementById('sentEmailDisplay');
    const backToLogin = document.getElementById('backToLogin');
    const backToLoginFromSuccess = document.getElementById('backToLoginFromSuccess');

    // ============ TOAST ============
    function showToast(message, isError = false) {
      const existing = document.querySelector('.toast-message');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast-message' + (isError ? ' error' : '');
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ============ SEND RESET LINK (Backend API) ============
    sendResetBtn.addEventListener('click', async () => {
      const email = resetEmail.value.trim();

      if (!email) {
        infoMessage.style.display = 'block';
        infoMessage.textContent = 'Please enter your email address';
        infoMessage.classList.add('error');
        setTimeout(() => {
          infoMessage.style.display = 'none';
          infoMessage.classList.remove('error');
        }, 3000);
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        infoMessage.style.display = 'block';
        infoMessage.textContent = 'Please enter a valid email address';
        infoMessage.classList.add('error');
        setTimeout(() => {
          infoMessage.style.display = 'none';
          infoMessage.classList.remove('error');
        }, 3000);
        return;
      }

      try {
        // Call your backend forgot-password API
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        // Always show success message for security (don't reveal if email exists)
        sentEmailDisplay.textContent = email;
        resetFormContent.style.display = 'none';
        successContent.style.display = 'block';
        showToast(`Reset link sent to ${email}! Check your inbox.`, false);
        
      } catch (error) {
        console.error('Forgot password error:', error);
        infoMessage.style.display = 'block';
        infoMessage.textContent = 'Server error. Please try again.';
        infoMessage.classList.add('error');
        setTimeout(() => {
          infoMessage.style.display = 'none';
          infoMessage.classList.remove('error');
        }, 3000);
      }
    });

    // ============ BACK TO LOGIN ============
    function goBackToLogin() {
      window.location.href = 'login.html';
    }

    backToLogin.addEventListener('click', (e) => {
      e.preventDefault();
      goBackToLogin();
    });

    backToLoginFromSuccess.addEventListener('click', (e) => {
      e.preventDefault();
      goBackToLogin();
    });

    // ============ ENTER KEY SUPPORT ============
    resetEmail.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendResetBtn.click();
      }
    });
  </script>
</body>
</html>
